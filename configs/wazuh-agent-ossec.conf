<!--
Wazuh Agent Event Channel Configuration
Endpoint: WIN11-ENDPOINT
Wazuh Agent version used in the lab: 4.8.2

This file contains the event-channel collection blocks used by the project.
It is intentionally provided as a configuration snippet rather than a full
production ossec.conf file.
-->

<!-- Sysmon telemetry -->
<localfile>
  <location>Microsoft-Windows-Sysmon/Operational</location>
  <log_format>eventchannel</log_format>
</localfile>

<!-- Windows Task Scheduler telemetry -->
<localfile>
  <location>Microsoft-Windows-TaskScheduler/Operational</location>
  <log_format>eventchannel</log_format>
</localfile>

<!-- Microsoft Defender telemetry -->
<localfile>
  <location>Microsoft-Windows-Windows Defender/Operational</location>
  <log_format>eventchannel</log_format>
</localfile>
